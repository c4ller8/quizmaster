<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuizMaster - test your javascript knowledge">
    <title>Quizmaster</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="icon" href="assets/images/favicon_io (1)/favicon.ico">
</head>

<body>
    <header>
        <h1>QuizMaster</h1>
    </header>

    <main>
        <!-- Screen 1: Start -->
        <section id="start-screen" class="screen">
            <h2>Welcome</h2>
            <p>Enter a username to begin.</p>
            <input type="text" id="username-input" placeholder="Your name" aria-label="Username">
            <p id="start-error" class="error" role="alert"></p>
            <button id="start-btn">Start Quiz</button>
        </section>

        <!-- Screen 2: Quiz -->
        <section id="quiz-screen" class="screen hidden">
            <p id="progress">Question 1 of 10</p>
            <p id="score-display">Score: 0</p>
            <h2 id="question-text"></h2>
            <div id="answer-buttons"></div>
            <p id="feedback" role="alert"></p>
            <button id="next-btn" class="hidden">Next</button>
        </section>

        <!-- Screen 3: Results -->
        <section id="result-screen" class="screen hidden">
            <h2>Quiz Complete!</h2>
            <p id="final-score"></p>
            <p id="result-message"></p>
            <button id="restart-btn">Play Again</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuizMaster</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
